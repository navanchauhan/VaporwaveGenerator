[project]
name = "vaporwave-generator"
version = "2.7.0"
description = "Generate vaporwave music and VHS-style images/videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.0",
    "logzero>=1.7.0",
    "numpy>=2.0.0",
    "opencv-python>=4.11.0",
    "pillow>=11.0.0",
    "scipy>=1.15.0",
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vaporwave-generator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
